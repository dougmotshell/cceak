# Atualizações automáticas de segurança para as ações de CI (CTRL-05).
# Classificação da informação (ISO/IEC 27001): Uso Interno
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
