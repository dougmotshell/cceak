# Segurança (CTRL-01..CTRL-08 em docs/pt-br/architecture/controles-seguranca-soc2.md).
# Todas as ferramentas são de código aberto ou gratuitas: custo zero.
# Ações fixadas por versão maior; antes de endurecer, troque por SHA completo (ver dependabot.yml).
name: security on: push: branches: ["**"] pull_request: schedule: # Varredura de CVE diária: uma vulnerabilidade nova não espera o próximo commit. - cron: "17 6 * * *" workflow_dispatch: # Mínimo privilégio: o padrão é somente leitura; cada job pede o que precisa.
permissions: contents: read concurrency: group: security-${{ github.ref }} cancel-in-progress: true jobs: config: name: CTRL-01/02/07 · cabeçalhos, RLS, segredos e innerHTML runs-on: ubuntu-latest steps: - uses: actions/checkout@v4 - uses: actions/setup-node@v4 with: node-version: "22" - name: Verificação de configuração de segurança run: node scripts/security-config-check.mjs - name: Verificação do site run: node scripts/check-site.mjs secrets: name: CTRL-03 · segredos no histórico runs-on: ubuntu-latest steps: - uses: actions/checkout@v4 with: fetch-depth: 0 # o histórico inteiro, para achar segredo já commitado - name: gitleaks uses: gitleaks/gitleaks-action@v2 env: GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} sast: name: CTRL-04 · análise estática (Semgrep) runs-on: ubuntu-latest container: image: semgrep/semgrep:1.100.0 steps: - uses: actions/checkout@v4 # Regras oficiais: OWASP Top 10, JavaScript e segurança de HTML/DOM. # --error faz o job falhar em qualquer achado; ajuste em semgrep.yml se houver falso positivo aceito. - name: semgrep run: semgrep scan --config p/owasp-top-ten --config p/javascript --config p/xss --error --metrics=off cve: name: CTRL-05 · CVE em dependências (OSV) permissions: contents: read security-events: write actions: read uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0 with: scan-args: |- --recursive ./ fail-on-vuln: true
