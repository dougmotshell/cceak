# Gateway local: serve o site e roteia a API na mesma origem (como o Kong do Supabase).
server { listen 80; server_name _; root /usr/share/nginx/html; index index.html; server_tokens off; client_max_body_size 1m; add_header X-Content-Type-Options "nosniff" always; add_header X-Frame-Options "DENY" always; add_header Referrer-Policy "strict-origin-when-cross-origin" always; # API REST (PostgREST). A barra final remove o prefixo /rest/v1/. location /rest/v1/ { proxy_pass http://postgrest:3000/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; } # Autenticação (GoTrue). A barra final remove o prefixo /auth/v1/. location /auth/v1/ { proxy_pass http://auth:9999/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; } # Site estático com URLs limpas, como no vercel.json (cleanUrls). location / { try_files $uri $uri/index.html $uri.html =404; } error_page 404 /404.html;
}
