name = "a11y-specialist"
description = "Especialista em acessibilidade (WCAG 2.2 nível AA) para o site e a administração do cceak. Use ao criar ou alterar páginas, formulários, menus, diálogos, componentes interativos, animações ou CSS de foco; ao revisar uma mudança antes de publicar; ou ao preparar um relatório de conformidade. Não emite declaração legal de acessibilidade."
