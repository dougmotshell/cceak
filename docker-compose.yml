# Ambiente local completo do cceak (frontend, API, autenticação e banco).
# Classificação da informação (ISO/IEC 27001): Uso Interno
#
# Primeira vez:   node scripts/gen-local-env.mjs && docker compose up -d --wait
# Acessar:        http://localhost:8000  (site)  ·  http://localhost:8000/admin/  (administração)
# Login de teste: admin@local.test / dev-admin-123   (somente local)
# Parar:          docker compose down        (apagar também os dados: docker compose down -v)
#
# Todas as portas do host ficam em 127.0.0.1: nada fica acessível pela rede local.
name: cceak-local

services:
  db:
    # Postgres com o schema do Supabase (roles anon/authenticated, schema auth, pgcrypto).
    image: supabase/postgres:15.19.0.017
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?rode scripts/gen-local-env.mjs antes}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET:?rode scripts/gen-local-env.mjs antes}
      JWT_EXP: "3600"
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # A imagem do Supabase usa o superusuário supabase_admin (não postgres).
      test: ["CMD-SHELL", "pg_isready -U supabase_admin -h localhost -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    # Roda uma vez: migração 0001 e semente de dev, depois que o GoTrue criou o schema auth.
    # Idempotente, então rodar de novo a cada `up` é seguro.
    image: supabase/postgres:15.19.0.017
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?rode scripts/gen-local-env.mjs antes}
    entrypoint: ["/bin/sh", "/migrate.sh"]
    volumes:
      - ./docker/local/migrate.sh:/migrate.sh:ro
      - ./supabase/migrations/0001_site_settings.sql:/sql/0001_site_settings.sql:ro
      - ./supabase/migrations/0002_programacao_equipe.sql:/sql/0002_programacao_equipe.sql:ro
      - ./docker/local/seed-dev.sql:/sql/seed-dev.sql:ro
      - ./docker/local/seed-equipe-dev.sql:/sql/seed-equipe-dev.sql:ro

  postgrest:
    # API REST sobre o schema public, com RLS aplicada pelo banco.
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_POOL: "5"

  auth:
    # Autenticação por e-mail e senha. Cadastro público desligado.
    image: supabase/gotrue:v2.186.0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9999/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://localhost:8000
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:8000
      GOTRUE_URI_ALLOW_LIST: http://localhost:8000
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # Local não há SMTP: e-mails já nascem confirmados.
      GOTRUE_MAILER_AUTOCONFIRM: "true"

  web:
    # Gateway e frontend: serve o site estático e roteia /rest/v1 e /auth/v1.
    image: nginx:1.27-alpine
    healthcheck:
      # nginx serve o site; também consulta a API pelo gateway (prontidão do postgrest).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/rest/v1/ >/dev/null && wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    depends_on:
      - postgrest
      - auth
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      # env.js local (gerado pelo script) sobrepõe o do repositório, sem alterá-lo.
      - ./docker/local/env.js:/usr/share/nginx/html/assets/js/env.js:ro
      - ./docker/local/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db-data:
